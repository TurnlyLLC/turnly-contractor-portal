<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Properties | Turnly</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="property-workflows.css" />
</head>
<body>
  <main class="page wide-page">
    <section class="dashboard-card wide-card">
      <a href="admin.html" class="secondary-btn">← Back to Dashboard</a>

      <div class="dashboard-header">
        <div>
          <h1>Manage Properties</h1>
          <p>Add reusable property details, attach checklist templates, and set recurring assignment rules.</p>
        </div>
      </div>

      <form id="propertyForm">
        <input id="property_id_input" type="hidden" />

        <div class="panel property-entry-panel">
          <h2>Property Entry</h2>

          <div class="property-form-grid">
            <div>
              <label>Property Name</label>
              <input id="property_name_input" required />
            </div>

            <div>
              <label>Address</label>
              <input id="property_address_input" />
            </div>

            <div>
              <label>Default Service Type</label>
              <input id="property_service_type_input" />
            </div>

            <div>
              <label>Checklist Template</label>
              <select id="property_checklist_template_input">
                <option value="">No checklist template selected</option>
              </select>
            </div>

            <div class="span-two">
              <label>Default Scope of Work</label>
              <textarea id="property_scope_input"></textarea>
            </div>

            <div>
              <label>Supplies Notes</label>
              <textarea id="property_supplies_input"></textarea>
            </div>

            <div>
              <label>Special Instructions</label>
              <textarea id="property_instructions_input"></textarea>
            </div>

            <div class="span-two">
              <label>Access Notes</label>
              <textarea id="property_access_input"></textarea>
            </div>
          </div>
        </div>

        <div class="panel full-width">
          <h2>Recurring Assignments</h2>

          <div class="checklist-flags">
            <label>
              <input id="recurring_enabled_input" type="checkbox" />
              Create recurring assignments for this property
            </label>
          </div>

          <div class="recurring-grid">
            <div>
              <label>Frequency</label>
              <select id="recurring_frequency_input">
                <option value="weekly">Weekly</option>
                <option value="biweekly">Every 2 weeks</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>

            <div>
              <label>First Assignment Date</label>
              <input id="recurring_start_date_input" type="date" />
            </div>

            <div>
              <label>Start Time</label>
              <input id="recurring_start_time_input" type="time" />
            </div>

            <div>
              <label>End Time</label>
              <input id="recurring_end_time_input" type="time" />
            </div>

            <div>
              <label>Recurring Pay Amount</label>
              <input id="recurring_pay_amount_input" type="number" step="0.01" />
            </div>

            <div>
              <label>Assignment Title Template</label>
              <input id="recurring_assignment_title_input" placeholder="Weekly Clean" />
            </div>
          </div>
        </div>

        <div class="button-row">
          <button type="submit">Save Property</button>
          <button id="resetPropertyFormBtn" type="button" class="secondary-btn">New Property</button>
        </div>
      </form>

      <p id="propertyMessage" class="status-message"></p>

      <div class="panel current-properties-panel">
        <div class="panel-header">
          <div>
            <h2>Current Properties</h2>
            <p>Open a property to update details or recurring assignment rules.</p>
          </div>
        </div>
        <div id="propertiesList" class="assignment-list compact-property-list"></div>
      </div>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="property-workflows.js"></script>
  <script type="module" src="property-template-select.js"></script>
</body>
</html>
