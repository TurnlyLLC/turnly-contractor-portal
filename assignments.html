  <style id="assignment-list-critical">
    body[data-admin-page="assignments"] .assignment-list-panel .suite-toolbar .toolbar-left {
      display: none !important;
    }
    body[data-admin-page="assignments"] #adminAssignments > .empty-state {
      display: none !important;
    }
    body[data-admin-page="assignments"] .assignment-table-empty {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      min-height: 72px !important;
    }
    body[data-admin-page="assignments"] .assignment-table-empty .empty-lines {
      display: none !important;
    }
    body[data-admin-page="assignments"] #adminAssignments.assignment-open-list {
      display: grid;
      gap: 4px;
      grid-template-columns: 1fr;
      overflow-x: auto;
    }
    body[data-admin-page="assignments"] #adminAssignments > .assignment-list-item:not(.assignment-thin-list-item),
    body[data-admin-page="assignments"] #adminAssignments > .admin-assignment-row:not(.assignment-thin-list-item) {
      display: none !important;
    }
    body[data-admin-page="assignments"] .assignment-thin-list-item {
      border-radius: 6px;
      gap: 0;
      padding: 0;
    }
    body[data-admin-page="assignments"] .assignment-thin-list-item > .assignment-list-item-header,
    body[data-admin-page="assignments"] .assignment-thin-list-item > .assignment-detail-grid,
    body[data-admin-page="assignments"] .assignment-thin-list-item > .assignment-notes-drawer {
      display: none !important;
    }
    body[data-admin-page="assignments"] .assignment-thin-row {
      align-items: center;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(220px, 1.45fr) minmax(86px, 0.58fr) minmax(140px, 0.72fr) minmax(124px, 0.64fr) minmax(84px, 0.42fr) minmax(156px, 0.74fr) minmax(136px, max-content);
      min-height: 32px;
      min-width: 1020px;
      padding: 3px 8px;
    }
  </style>
