<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments | Turnly Admin</title>
  <link rel="icon" href="/favicon.ico?v=20260624t" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260624t" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260624t" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260624t" />
  <style id="assignment-list-critical">
    body[data-admin-page="assignments"] .assignment-list-panel .suite-toolbar .toolbar-left {
      display: none !important;
    }
    body[data-admin-page="assignments"] #adminAssignments.assignment-open-list {
      display: grid;
      gap: 5px;
      grid-template-columns: 1fr;
      overflow-x: auto;
    }
    body[data-admin-page="assignments"] .assignment-list-item {
      align-items: center;
      border-radius: 6px;
      display: grid;
      gap: 10px;
      grid-template-columns: minmax(230px, 1.05fr) minmax(520px, 2.4fr) minmax(132px, max-content);
      min-height: 44px;
      min-width: 980px;
      padding: 5px 8px;
    }
    body[data-admin-page="assignments"] .assignment-list-item-header {
      display: contents;
    }
    body[data-admin-page="assignments"] .assignment-title-block {
      align-items: center;
      display: grid;
      gap: 2px 8px;
      grid-template-columns: auto minmax(0, 1fr);
      min-width: 0;
    }
    body[data-admin-page="assignments"] .assignment-short-id {
      grid-row: 1 / span 2;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-title-block h3 {
      font-size: 13px;
      line-height: 1.2;
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-badge-row {
      align-items: center;
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }
    body[data-admin-page="assignments"] .assignment-badge-row .status-badge {
      border-radius: 999px;
      font-size: 9px;
      line-height: 1;
      max-width: 120px;
      overflow: hidden;
      padding: 3px 6px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-detail-grid {
      display: grid;
      gap: 6px;
      grid-template-columns: minmax(150px, 1.1fr) minmax(160px, 1.1fr) minmax(180px, 1.2fr) minmax(86px, .58fr);
      min-width: 0;
    }
    body[data-admin-page="assignments"] .assignment-detail-cell {
      align-items: center;
      background: rgba(7, 18, 32, 0.46);
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 6px;
      display: grid;
      gap: 1px;
      min-height: 34px;
      min-width: 0;
      padding: 4px 7px;
    }
    body[data-admin-page="assignments"] .assignment-detail-cell span {
      align-items: center;
      color: var(--suite-soft, #9aaabc);
      display: flex;
      font-size: 9px;
      font-weight: 900;
      gap: 4px;
      letter-spacing: 0.03em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-detail-cell span svg {
      height: 11px;
      width: 11px;
    }
    body[data-admin-page="assignments"] .assignment-detail-cell strong {
      color: var(--suite-text, #f7fbff);
      display: block;
      font-size: 12px;
      line-height: 1.18;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-detail-cell small {
      color: var(--suite-muted, #7f91a6);
      display: block;
      font-size: 10px;
      line-height: 1.12;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-row-actions {
      align-items: center;
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
      justify-content: flex-end;
      min-width: 0;
    }
    body[data-admin-page="assignments"] .assignment-row-actions .table-action-button,
    body[data-admin-page="assignments"] .assignment-action-muted {
      border-radius: 5px;
      font-size: 10px;
      min-height: 26px;
      padding: 4px 8px;
      white-space: nowrap;
    }
    body[data-admin-page="assignments"] .assignment-notes-preview {
      display: none !important;
    }
    body[data-admin-page="assignments"] .assignment-table-empty {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      min-height: 72px !important;
    }
    body[data-admin-page="assignments"] .assignment-table-empty .empty-lines {
      display: none !important;
    }
    @media (max-width: 980px) {
      body[data-admin-page="assignments"] #adminAssignments.assignment-open-list {
        overflow-x: visible;
      }
      body[data-admin-page="assignments"] .assignment-list-item {
        gap: 8px;
        grid-template-columns: 1fr;
        min-width: 0;
        padding: 8px;
      }
      body[data-admin-page="assignments"] .assignment-detail-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      body[data-admin-page="assignments"] .assignment-row-actions {
        justify-content: flex-start;
      }
    }
    @media (max-width: 620px) {
      body[data-admin-page="assignments"] .assignment-detail-grid {
        grid-template-columns: 1fr;
      }
      body[data-admin-page="assignments"] .assignment-row-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      body[data-admin-page="assignments"] .assignment-row-actions .table-action-button {
        width: 100%;
      }
    }
  </style>
  <link rel="stylesheet" href="admin-suite.css?v=20260623j" />
  <link rel="stylesheet" href="property-workflows.css" />
</head>
<body class="turnly-admin-suite" data-admin-page="assignments">
  <div id="adminSuiteApp"></div>
  <script src="env.js"></script>
  <script type="module" src="admin-suite.js?v=20260625b"></script>
  <script type="module" src="app.js?v=20260623j"></script>
  <script type="module" src="assignment-client-source.js?v=20260626e"></script>
  <script type="module" src="assignment-date-time-controls.js?v=20260626b"></script>
  <script type="module" src="assignment-unit-metadata.js?v=20260626c"></script>
  <script type="module" src="assignment-contractor-source.js?v=20260624b"></script>
  <script type="module" src="qa-checklists-nav.js?v=20260626a"></script>
</body>
</html>
