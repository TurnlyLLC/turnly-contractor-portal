<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Assignments | Turnly</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="property-workflows.css" />
</head>
<body>
  <main class="page wide-page">
    <section class="dashboard-card wide-card">
      <a href="admin.html" class="secondary-btn">← Back to Dashboard</a>

      <h1>Add Assignment Block</h1>
      <p>Select a saved property to auto-fill assignment details.</p>

      <div class="panel">
        <div class="panel-header">
          <div>
            <h2>Recurring Assignment Queue</h2>
            <p>Generate open assignments for properties with recurring schedules due now.</p>
          </div>
          <button id="generateRecurringAssignmentsBtn" type="button" class="small-btn">Generate Due Assignments</button>
        </div>
        <p id="recurringMessage" class="status-message"></p>
      </div>

      <form id="assignmentForm">
        <label>Select Property</label>
        <select id="propertySelect" required>
          <option value="">Choose a property...</option>
        </select>

        <input id="property_id" type="hidden" />

        <label>Assignment Title</label>
        <input id="title" required placeholder="Apartment Turnover - Unit 204" />

        <label>Property Name</label>
        <input id="property_name" required />

        <label>Address</label>
        <input id="address" />

        <label>Service Type</label>
        <input id="service_type" />

        <label>Scope of Work</label>
        <textarea id="scope"></textarea>

        <label>Pay Amount</label>
        <input id="pay_amount" type="number" step="0.01" />

        <label>Start Window</label>
        <input id="start_window" type="datetime-local" />

        <label>End Window</label>
        <input id="end_window" type="datetime-local" />

        <label>Supplies Notes</label>
        <textarea id="supplies_notes"></textarea>

        <label>Special Instructions</label>
        <textarea id="special_instructions"></textarea>

        <div id="assignmentChecklistPreview" class="checklist-summary"></div>

        <button type="submit">Post Assignment</button>
      </form>

      <p id="message"></p>

      <h2>Posted Assignments</h2>
      <div id="adminAssignments" class="assignment-list"></div>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="property-workflows.js"></script>
</body>
</html>
