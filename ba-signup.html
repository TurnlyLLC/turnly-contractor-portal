<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Create your ambassador account | Turnly</title><link rel="stylesheet" href="ba-workspace-20261019.css"></head><body class="ba-signup-body"><main class="ba-signup-card"><img src="assets/turnly-website-logo.png" alt="Turnly" width="64" height="64"><p class="ba-eyebrow">WELCOME TO THE TEAM</p><h1>Create your password.</h1><p>Your email is your username. Your workspace opens as soon as your account is ready.</p><p id="message" role="status">Loading your application…</p><form id="signup" hidden><label>Email / username<input name="email" type="email" readonly autocomplete="username"></label><label>Create password<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p>Use at least 12 characters. If you already have a Turnly account, enter its current password.</p><button class="ba-primary">Create account & open workspace</button></form><p><a href="ba-login.html">Already have an account? Sign in</a></p></main><script src="env.js"></script><script type="module" src="ba-signup.mjs"></script></body></html>
