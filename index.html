<!DOCTYPE html>

<head>

  <title>Turnly Portal</title>
  <link rel="stylesheet" href="style.css" />

<body class="public-portal-body">
  <main class="public-shell portal-entry-main">
    <section class="portal-choice-grid" aria-label="Portal choices">
