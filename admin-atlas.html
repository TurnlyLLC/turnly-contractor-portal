<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Atlas | Turnly Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui;color:#143d41;background:#f3f7f5}header{display:flex;align-items:center;gap:16px;padding:12px 3vw;background:white;border-bottom:1px solid #cee0da;flex-wrap:wrap}header strong{margin-right:auto}a{color:#07675f}button,input,textarea,select{font:inherit;padding:8px;border:1px solid #96b9ae;border-radius:8px}button{cursor:pointer;background:#edf6f2;color:#174a42}iframe{width:100%;height:calc(100dvh - 75px);border:0}dialog{width:min(600px,95vw);border:1px solid #9cb7ad;border-radius:16px}label{display:grid;gap:4px;margin:8px 0}fieldset{margin:12px 0}#edges>div{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}#edges select{max-width:100%}p[role=status]{margin:5px 3vw}dialog::backdrop{background:#092d3880}</style>
<header><a href="admin.html">← Admin portal</a><strong>Business Atlas</strong><button id="edit" disabled>Edit current stop</button></header><p role="status" id="status">Loading atlas…</p>
<iframe id="atlas" title="Interactive Turnly business atlas" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe>
<dialog id="editor"><form id="form"><h2>Edit atlas stop</h2><label>Name<input id="title" required maxlength="180"></label><label>Description<textarea id="description" rows="4"></textarea></label><label>Live page URL<input id="url" type="url" placeholder="https://"></label><fieldset><legend>Where can you go next?</legend><div id="edges"></div><button type="button" id="add">Add connection</button></fieldset><p id="notice" role="status"></p><button id="save">Save changes</button> <button type="button" id="cancel">Cancel</button></form></dialog>
<script src="env.js"></script><script type="module" src="admin-atlas.mjs"></script></html>
