<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnly document approval settings</title><script src="env.js"></script><style>body{font:16px/1.6 system-ui;background:#f0f6f9;color:#12354e;max-width:900px;margin:40px auto;padding:24px}main{background:white;border-radius:18px;padding:32px}button{background:#073b60;color:white;padding:14px 20px;border:0;border-radius:9px;font:inherit;cursor:pointer}td,th{padding:12px 16px;text-align:left;border-bottom:1px solid #e0eaf0}table{width:100%;border-collapse:collapse}a{color:#087c9d}</style></head><body><main><a href="directory.html">← Contractor directory</a><h1>Document approval settings</h1><p>Automatically accept submitted W-9 forms and bank verification. Contractors must still submit these documents. COI and background-check review stay manual.</p><button id="apply" disabled>Enable automatic W-9 and bank verification approval</button><div id="result" role="status">Loading…</div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/+esm';
const client=createClient(window.__ENV.SUPABASE_URL,window.__ENV.SUPABASE_ANON_KEY);
const root=document.getElementById('result'),button=document.getElementById('apply');
async function load(action){button.disabled=true;try{const {data:{session}}=await client.auth.getSession();if(!session)throw Error('Sign in to the admin portal first.');const r=await fetch('/api/contractor-review',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({action})});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to save.');root.replaceChildren();const p=document.createElement('p');p.textContent=data.ready?'Automatic approval is enabled for W-9 and bank verification.':'W-9 and bank verification are waiting for automatic approval to be enabled.';root.append(p);const table=document.createElement('table');const head=table.insertRow();for(const text of ['Document','Review']){const th=document.createElement('th');th.textContent=text;head.append(th);}for(const item of data.items.filter(i=>i.active)){const row=table.insertRow();row.insertCell().textContent=item.title;row.insertCell().textContent=item.requiresReview?'Manual review':'Automatic on submission';}root.append(table);button.disabled=data.ready;button.textContent=data.ready?'Automatic approval enabled':'Enable automatic W-9 and bank verification approval';}catch(e){root.textContent=e.message;button.disabled=false;}}
button.onclick=()=>load('document_policy_apply');await load('document_policy_inspect');
</script></body></html>
