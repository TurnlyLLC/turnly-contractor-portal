<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Turnly Contractor Portal</title>
  <link rel="icon" href="/favicon.ico?v=20260624t" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260624t" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260624t" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260624t" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="auth-card">
      <h1>Turnly Portal Login</h1>
      <p>Sign in to access your Turnly workspace.</p>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required />

        <label>Password</label>
        <input type="password" id="password" required />

        <button type="submit">Sign In</button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="portal-login.js?v=20260828-contractor-desktop-split"></script>
</body>
</html>
