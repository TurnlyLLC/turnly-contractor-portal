<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Dashboard | Turnly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="dashboard-card" id="contractorDashboard">
      <div class="dashboard-header">
        <div>
          <h1>Contractor Dashboard</h1>
          <p>View available Turnly work and track the assignments you have claimed.</p>
        </div>
        <button id="logoutBtn" class="small-btn">Sign Out</button>
      </div>

      <div class="grid">
        <a href="contractor-available.html" class="tile-link">
          <div class="tile">
            <h3>Available Assignments</h3>
            <p>Review open work blocks and claim the jobs you want.</p>
          </div>
        </a>

        <a href="contractor-my-assignments.html" class="tile-link">
          <div class="tile">
            <h3>My Assignments</h3>
            <p>See the jobs you have claimed and what is coming up.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
