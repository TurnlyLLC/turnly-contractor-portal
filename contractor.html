<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Available Assignments | Turnly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page wide-page">
    <section class="dashboard-card wide-card">
      <div class="dashboard-header">
        <div>
          <h1>Contractor Dashboard</h1>
          <p>Claim available Turnly assignments and track the jobs assigned to you.</p>
        </div>
        <button id="logoutBtn" class="small-btn">Sign Out</button>
      </div>

      <p id="claimMessage" class="status-message"></p>

      <div class="dashboard-section">
        <h2>Available Assignments</h2>
        <p>Open work blocks that are ready to claim.</p>
        <div id="contractorAssignments" class="assignment-list"></div>
      </div>

      <div class="dashboard-section">
        <h2>My Assignments</h2>
        <p>Jobs you have already claimed.</p>
        <div id="myAssignments" class="assignment-list"></div>
      </div>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
