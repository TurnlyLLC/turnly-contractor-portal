<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Turnly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="dashboard-card">
      <h1>Admin Dashboard</h1>
      <p>Create available assignment blocks for contractors.</p>

      <form id="assignmentForm">
        <label>Assignment Title</label>
        <input id="title" required placeholder="Apartment Turnover - Unit 204" />

        <label>Property Name</label>
        <input id="property_name" required placeholder="Vetra Forest Hills" />

        <label>Address</label>
        <input id="address" placeholder="123 Main St, Raleigh, NC" />

        <label>Service Type</label>
        <input id="service_type" placeholder="Apartment Turnover, Commercial Clean, Daycare Reset" />

        <label>Scope of Work</label>
        <textarea id="scope" placeholder="Kitchen, bathrooms, floors, trash, final walkthrough"></textarea>

        <label>Pay Amount</label>
        <input id="pay_amount" type="number" step="0.01" placeholder="75.00" />

        <label>Start Window</label>
        <input id="start_window" type="datetime-local" />

        <label>End Window</label>
        <input id="end_window" type="datetime-local" />

        <label>Supplies Notes</label>
        <textarea id="supplies_notes" placeholder="Supplies on site, bring vacuum, etc."></textarea>

        <label>Special Instructions</label>
        <textarea id="special_instructions" placeholder="Lockbox code, parking notes, client-specific details"></textarea>

        <button type="submit">Post Assignment</button>
      </form>

      <p id="message"></p>

      <h2>Posted Assignments</h2>
      <div id="adminAssignments" class="assignment-list"></div>

      <button id="logoutBtn">Sign Out</button>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
