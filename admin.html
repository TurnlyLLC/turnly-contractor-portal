<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Turnly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="dashboard-card">
      <div class="dashboard-header">
        <div>
          <h1>Turnly Admin Dashboard</h1>
          <p>Manage properties, assignments, and QA workflows.</p>
        </div>
        <button id="logoutBtn" class="small-btn">Sign Out</button>
      </div>

      <div class="grid">
        <a href="properties.html" class="tile-link">
          <div class="tile">
            <h3>Manage Properties</h3>
            <p>Add and manage saved client/property details.</p>
          </div>
        </a>

        <a href="assignments.html" class="tile-link">
          <div class="tile">
            <h3>Add Assignments</h3>
            <p>Create assignment blocks using saved properties.</p>
          </div>
        </a>

        <div class="tile">
          <h3>QA Review</h3>
          <p>Coming in Phase 5.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
