<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Turnly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="dashboard-card">
      <h1>Admin Dashboard</h1>
      <p>Post assignments, review QA uploads, and manage contractor activity.</p>

      <div class="grid">
        <div class="tile">
          <h3>Assignment Blocks</h3>
          <p>Coming in Phase 2.</p>
        </div>

        <div class="tile">
          <h3>QA Review</h3>
          <p>Coming in Phase 5.</p>
        </div>

        <div class="tile">
          <h3>Contractors</h3>
          <p>View contractor profiles and status.</p>
        </div>
      </div>

      <button id="logoutBtn">Sign Out</button>
    </section>
  </main>

  <script src="env.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
