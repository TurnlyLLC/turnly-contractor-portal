<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Turnly Portal</title>
  <link rel="icon" href="/favicon.ico?v=20260624t" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260624t" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260624t" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260624t" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="portal-public.css" />
  <link rel="stylesheet" href="portal-auth-overrides.css?v=20260722b" />
</head>
<body class="public-portal-body">
  <div class="public-shell">
    <header class="public-nav">
      <a class="public-brand" href="index.html" aria-label="Turnly home">
        <span class="public-brand-mark">T</span>
        <span>
          <strong>TURNLY</strong>
          <small>Password Reset</small>
        </span>
      </a>

      <nav class="public-nav-actions" aria-label="Password reset navigation">
        <a href="index.html">Portal Home</a>
      </nav>
    </header>

    <main class="role-auth-layout">
      <section class="role-auth-intro">
        <p class="public-kicker">Secure Access</p>
        <h1>Set a new Turnly password.</h1>
        <p>
          Enter a new password after opening the reset link from your email.
        </p>
      </section>

      <section class="role-auth-card" aria-live="polite">
        <div class="public-panel-heading">
          <div>
            <span>Password Reset</span>
            <strong id="resetTitle">Checking your reset link...</strong>
          </div>
          <small>Supabase Auth</small>
        </div>

        <p id="resetMessage" class="signup-message">
          Hold tight while we confirm this reset link.
        </p>

        <form id="resetPasswordForm" class="public-form callback-reset-form" hidden>
          <div class="public-form-grid">
            <label class="span-two">
              New Password
              <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required />
            </label>
            <label class="span-two">
              Verify Password
              <input type="password" id="verifyPassword" autocomplete="new-password" minlength="6" required />
            </label>
          </div>
          <button class="public-btn primary full" type="submit">Update Password</button>
        </form>

        <a id="resetAction" class="public-btn primary full" href="index.html" hidden>
          Return To Log In
        </a>
      </section>
    </main>
  </div>

  <script src="env.js"></script>
  <script type="module" src="reset-password.js?v=20260722b"></script>
</body>
</html>
