<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Turnly" />
  <title>Contractor Access | Turnly Portal</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico?v=20260624t" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260624t" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=20260624t" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=20260624t" />
  <link rel="apple-touch-icon" href="/icons/turnly-icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="portal-public.css?v=20260803-logo-favicon" />
  <link rel="stylesheet" href="portal-auth-overrides.css?v=20260722d" />
</head>
<body class="public-portal-body" data-auth-role="contractor" data-auth-home="contractor.html" data-auth-label="Contractor">
  <div class="public-shell">
    <header class="public-nav">
      <a class="public-brand" href="index.html" aria-label="Turnly home">
        <span class="public-brand-mark">T</span>
        <span>
          <strong>TURNLY</strong>
          <small>Contractor Portal</small>
        </span>
      </a>

      <nav class="public-nav-actions" aria-label="Contractor access navigation">
        <a href="index.html">Portal Home</a>
      </nav>
    </header>

    <main class="role-auth-layout">
      <section class="role-auth-intro">
        <p class="public-kicker">Contractor Access</p>
        <h1>Assignments, claims, and work updates.</h1>
        <p>
          Sign in or create a contractor account to view available assignments,
          track claimed work, and prepare job completion details.
        </p>
      </section>

      <section class="role-auth-card" aria-label="Contractor authentication">
        <div class="auth-mode-tabs" role="tablist" aria-label="Contractor account mode">
          <button class="active" type="button" data-auth-mode="login">Log In</button>
          <button type="button" data-auth-mode="signup">Sign Up</button>
        </div>

        <form id="loginForm" class="public-form auth-panel active" data-auth-panel="login">
          <div class="public-form-grid">
            <label class="span-two">
              Email
              <input type="email" id="loginEmail" autocomplete="email" required />
            </label>
            <label class="span-two">
              Password
              <input type="password" id="loginPassword" autocomplete="current-password" required />
            </label>
          </div>
          <button class="public-btn primary full" type="submit">Log In</button>
          <div class="auth-helper-row">
            <a class="auth-text-action" href="reset-password.html">Forgot your password?</a>
          </div>
        </form>

        <form id="signupForm" class="public-form auth-panel" data-auth-panel="signup">
          <div class="public-form-grid">
            <label>
              First Name
              <input type="text" id="firstName" autocomplete="given-name" required />
            </label>
            <label>
              Last Name
              <input type="text" id="lastName" autocomplete="family-name" required />
            </label>
            <label class="span-two">
              Email
              <input type="email" id="signupEmail" autocomplete="email" required />
            </label>
            <label class="span-two">
              Phone Number
              <input type="tel" id="phone" autocomplete="tel" required />
            </label>
            <label>
              Password
              <input type="password" id="signupPassword" autocomplete="new-password" minlength="6" required />
            </label>
            <label>
              Verify Password
              <input type="password" id="verifyPassword" autocomplete="new-password" minlength="6" required />
            </label>
          </div>
          <button class="public-btn primary full" type="submit">Create Contractor Account</button>
        </form>

        <p id="authMessage" class="signup-message" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="env.js"></script>
  <script src="auth-recovery-router.js?v=20260722e"></script>
  <script type="module" src="pwa-register.js?v=20260708a"></script>
  <script type="module" src="portal-auth.js?v=20260722e"></script>
</body>
</html>
