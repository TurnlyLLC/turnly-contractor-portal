          <span class="pm-nav-label">Overview</span>

        <a class="nav-link" href="#turn-requests" data-pm-view="turn-requests">
          <span class="pm-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect x="4" y="4" width="16" height="18" rx="2"/><path d="M8 11h8"/><path d="M8 15h5"/></svg></span>

      <div class="pm-sidebar-trust" aria-hidden="true">
        <span></span>
        <strong>Trusted<br />Portal Access</strong>
      </div>

    <section class="command-main wip-main">
      <header class="command-header">
        <div>
          <h1>Property Manager Portal</h1>
          <p>Property details, schedules, cleaning reports, and service feedback.</p>
        </div>

      <section class="panel-card pm-lock-panel">
        <p class="wip-kicker">Property Manager Portal</p>
        <h2>Loading portal</h2>
        <p>Loading property details, schedules, reports, feedback, and messages.</p>
      </section>
    </section>
